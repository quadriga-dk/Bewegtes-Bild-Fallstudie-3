<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interaktiver FDM-Workflow – QUADRIGA Bewegtes Bild 3</title>

<style>
:root{
  --bg: transparent;
  --panel:#ffffff;
  --panel-soft:#f7f7fb;
  --text:#1f2430;
  --muted:#667085;
  --border:#d9dce7;
  --accent:#6b5cff;
  --accent-soft:#eeecff;
  --shadow:0 10px 28px rgba(31,36,48,.07);
}

@media (prefers-color-scheme: dark){
  :root{
    --panel:#1d2230;
    --panel-soft:#242a39;
    --text:#f4f5f7;
    --muted:#a9b0bf;
    --border:#3b4356;
    --accent:#a99cff;
    --accent-soft:#302b55;
    --shadow:none;
  }
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  line-height:1.45;
}

.workflow{
  width:100%;
  max-width:1180px;
  margin:0 auto;
  padding:8px 4px 14px;
}

/* Navigation */
.steps{
  position:relative;
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:10px;
  align-items:stretch;
  margin-bottom:14px;
}

.steps::before{
  content:"";
  position:absolute;
  left:5%;
  right:5%;
  top:40px;
  height:3px;
  background:var(--border);
  border-radius:999px;
  z-index:0;
}

.step{
  appearance:none;
  position:relative;
  z-index:1;
  min-width:0;
  min-height:124px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--panel);
  color:var(--text);
  box-shadow:var(--shadow);
  padding:14px 12px;
  cursor:pointer;
  font:inherit;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  gap:10px;
  transition:border-color .18s ease, background .18s ease, transform .18s ease;
}

.step:hover{
  border-color:var(--accent);
  transform:translateY(-2px);
}

.step:focus-visible{
  outline:3px solid var(--accent-soft);
  outline-offset:2px;
}

.step.active{
  border:2px solid var(--accent);
  background:var(--accent-soft);
  transform:translateY(-2px);
}

.num{
  width:32px;
  height:32px;
  flex:0 0 32px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--accent);
  color:#fff;
  font-size:13px;
  font-weight:800;
  box-shadow:0 0 0 5px var(--panel);
}

.step.active .num{
  box-shadow:0 0 0 5px var(--accent-soft);
}

.step-title{
  width:100%;
  min-width:0;
  text-align:center;
  font-size:14px;
  line-height:1.16;
  font-weight:750;
  overflow-wrap:normal;
  word-break:normal;
  hyphens:auto;
}

/* Detail area */
.detail{
  display:grid;
  grid-template-columns:1.06fr .94fr;
  gap:12px;
}

.detail-card{
  min-width:0;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--panel);
  padding:20px 22px;
}

.eyebrow{
  margin-bottom:6px;
  color:var(--muted);
  font-size:11px;
  line-height:1.2;
  letter-spacing:.09em;
  text-transform:uppercase;
  font-weight:800;
}

.detail h2{
  margin:0 0 10px;
  font-size:21px;
  line-height:1.18;
}

.detail p{
  margin:0;
  color:var(--muted);
  font-size:15px;
  line-height:1.55;
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:16px;
}

.chip{
  padding:5px 9px;
  border:1px solid var(--border);
  border-radius:999px;
  background:var(--panel-soft);
  color:var(--muted);
  font-size:11px;
}

.output-box{
  display:flex;
  align-items:flex-start;
  gap:13px;
  min-height:126px;
  padding:15px;
  border-radius:15px;
  background:var(--panel-soft);
}

.output-icon{
  width:40px;
  height:40px;
  flex:0 0 40px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:var(--accent-soft);
  font-size:21px;
}

.output-box strong{
  display:block;
  margin:2px 0 5px;
  font-size:17px;
  line-height:1.25;
}

.output-box p{
  font-size:14px;
  line-height:1.48;
}

/* responsive */
@media(max-width:900px){
  .steps{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
  .steps::before{display:none}
}

@media(max-width:680px){
  .detail{
    grid-template-columns:1fr;
  }
}

@media(max-width:520px){
  .steps{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
  .step{
    min-height:112px;
  }
  .detail-card{
    padding:17px;
  }
}

@media(prefers-reduced-motion:reduce){
  *{transition:none!important}
}
</style>
</head>

<body>
<div class="workflow" id="fdmWorkflow">

  <section class="steps" aria-label="Schritte zur Datenpublikation">
    <button type="button" class="step active" data-step="0" aria-pressed="true">
      <span class="num">1</span>
      <span class="step-title">Forschungsdaten&shy;management</span>
    </button>

    <button type="button" class="step" data-step="1" aria-pressed="false">
      <span class="num">2</span>
      <span class="step-title">Metadatenstandards</span>
    </button>

    <button type="button" class="step" data-step="2" aria-pressed="false">
      <span class="num">3</span>
      <span class="step-title">Publikationsstrategien</span>
    </button>

    <button type="button" class="step" data-step="3" aria-pressed="false">
      <span class="num">4</span>
      <span class="step-title">Aufbereitung &amp;<br>Anreicherung</span>
    </button>

    <button type="button" class="step" data-step="4" aria-pressed="false">
      <span class="num">5</span>
      <span class="step-title">Versionierung,<br>Lizenzierung &amp;<br>Organisation</span>
    </button>

    <button type="button" class="step" data-step="5" aria-pressed="false">
      <span class="num">6</span>
      <span class="step-title">Dateninfrastrukturen</span>
    </button>
  </section>

  <section class="detail" aria-live="polite">
    <div class="detail-card">
      <div class="eyebrow" id="detailStep">Schritt 1 von 6</div>
      <h2 id="detailTitle">Forschungsdatenmanagement</h2>
      <p id="detailText"></p>
      <div class="chips" id="detailChips"></div>
    </div>

    <div class="detail-card">
      <div class="eyebrow">Ergebnis dieses Schritts</div>
      <div class="output-box">
        <div class="output-icon" id="outputIcon" aria-hidden="true">🧭</div>
        <div>
          <strong id="outputTitle"></strong>
          <p id="outputText"></p>
        </div>
      </div>
    </div>
  </section>

</div>

<script>
(() => {
  const root = document.getElementById("fdmWorkflow");
  if (!root || root.dataset.initialized === "true") return;
  root.dataset.initialized = "true";

  const data = [
    {
      title:"Forschungsdatenmanagement",
      text:"Forschungsdaten definieren, einordnen und ihre Entstehungsbedingungen kritisch reflektieren.",
      chips:["Datenarten","FDM","Datenkritik"],
      icon:"🧭",
      outTitle:"Orientierung und Planung",
      outText:"Die Anforderungen sind geklärt, die Daten sind eingeordnet und es liegt vor, wie sie im Projektverlauf verwendet werden sollen."
    },
    {
      title:"Metadatenstandards",
      text:"Metadaten auswählen, strukturieren und geeignete generische sowie fachspezifische Standards beurteilen.",
      chips:["Metadaten","Standards","Vokabulare","Diskriminierungssensibilität"],
      icon:"🏷️",
      outTitle:"Beschreibbare und verknüpfbare Daten",
      outText:"Die Daten erhalten eine nachvollziehbare Struktur und können durch konsistente Metadaten beschrieben und erschlossen werden."
    },
    {
      title:"Publikationsstrategien",
      text:"Publikationswege, Repositorien und Anforderungen vergleichen und für den eigenen Datensatz eine passende Strategie auswählen.",
      chips:["Repositorien","FAIR","Publikationswege"],
      icon:"📤",
      outTitle:"Passender Publikationsweg",
      outText:"Es liegt eine begründete Entscheidung vor, wo und unter welchen Bedingungen das Datenset veröffentlicht werden soll."
    },
    {
      title:"Aufbereitung und Anreicherung",
      text:"Daten bereinigen, validieren, dokumentieren, in geeignete Formate konvertieren und bei Bedarf anreichern.",
      chips:["Bereinigung","Validierung","Konvertierung","Moviebarcodes"],
      icon:"🛠️",
      outTitle:"Publikationsreife Daten",
      outText:"Der Datensatz ist konsistent, dokumentiert und methodisch sowie technisch so vorbereitet, dass Dritte ihn verstehen und weiterverarbeiten können."
    },
    {
      title:"Versionierung, Lizenzierung und Organisation",
      text:"Dateien und Ordner kuratieren, Versionen nachvollziehbar machen, Nutzungsbedingungen festlegen und Zitierinformationen vorbereiten.",
      chips:["Versionierung","Lizenz","CITATION.cff","Ordnerstruktur"],
      icon:"🗂️",
      outTitle:"Nachvollziehbarer Veröffentlichungsstand",
      outText:"Struktur, Version, Lizenz und Zitationsangaben sind transparent dokumentiert und für die Publikation vorbereitet."
    },
    {
      title:"Dateninfrastrukturen",
      text:"Das Repository aufbauen, Forschungsdaten einpflegen, einen Release veröffentlichen und persistente Identifikatoren nutzen.",
      chips:["GitHub","Zenodo","DOI","Langzeitarchivierung"],
      icon:"🚀",
      outTitle:"Publiziertes Datenset",
      outText:"Die Forschungsdaten sind auffindbar, referenzierbar und können unter dokumentierten Bedingungen nachgenutzt werden."
    }
  ];

  const buttons = [...root.querySelectorAll(".step")];

  function render(index){
    const s = data[index];

    buttons.forEach((button, i) => {
      const active = i === index;
      button.classList.toggle("active", active);
      button.setAttribute("aria-pressed", active ? "true" : "false");
    });

    root.querySelector("#detailStep").textContent = `Schritt ${index + 1} von ${data.length}`;
    root.querySelector("#detailTitle").textContent = s.title;
    root.querySelector("#detailText").textContent = s.text;
    root.querySelector("#outputIcon").textContent = s.icon;
    root.querySelector("#outputTitle").textContent = s.outTitle;
    root.querySelector("#outputText").textContent = s.outText;

    const chips = root.querySelector("#detailChips");
    chips.replaceChildren();

    s.chips.forEach(label => {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = label;
      chips.appendChild(chip);
    });
  }

  buttons.forEach((button, index) => {
    button.addEventListener("click", () => render(index));
  });

  render(0);
})();
</script>

</body>
</html>
